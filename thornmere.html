<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			color: #000;
		}

		:root {
			--bg-primary: #fff;
			--bg-secondary: #f2f0eb;
			--bg-card: #fff;
			--accent: #cc4125;
			--text-primary: #000;
			--text-secondary: #000;
			--border: #000;
			--sidebar-bg: #fff;
		}

		a {
			color: var(--accent);
			font-weight: 900;
		}

		body {
			font-family: "Crimson Text", serif;
			background: #fff;
			color: var(--text-primary);
			line-height: 1.6;
			margin: auto;
			font-size: 16px;
		}

		header {
			background-color: var(--bg-secondary);
			color: var(--text-secondary);
			padding: 10px;
			margin: 10px;
			text-align: left;
			line-height: 15px;
			border: 2px solid var(--border);
		}

		/* Main layout container */
		.main-layout {
			display: flex;
			gap: 10px;
			margin: 0 10px 10px 10px;
		}

		/* Sidebar styles */
		.sidebar {
			background-color: var(--bg-secondary);
			border: 2px solid var(--border);
			padding: 10px;
			width: 220px;
			flex-shrink: 0; /* Prevents sidebar from shrinking */
		}

		.sidebar h3 {
			color: var(--accent);
			font-weight: 900;
			font-size: 16px;
			margin-bottom: 5px;
			border-bottom: 2px solid var(--border);
			padding-bottom: 5px;
		}

		ul {
			list-style: none;
			padding-left: 0;
			padding-top: 5px;
		}

		li {
			margin-bottom: 8px;
			padding-left: 10px;
			border-left: 2px solid var(--accent);
		}

		.sidebar a {
			text-decoration: none;
			color: var(--text-primary);
			font-weight: 600;
		}

		.sidebar a:hover {
			color: var(--accent);
		}

		.wiki-container {
			background-color: var(--bg-secondary);
			border: 2px solid var(--border);
			padding: 10px;
			flex: 1;
			overflow-y: scroll;
			min-height: 600px;
		}

		.acc {
			color: var(--accent);
			font-weight: 900;
			font-size: 18px;
		}

		hr {
			margin-bottom: 5px;
			border-bottom: 1px solid var(--border);
		}

		.grid-container {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
		}
	</style>
	<body>
		<header>
			<span style="font-weight: 900; font-size: 20px"
				>The Annals of the Thorned Mere</span
			><br />
			A comprehensive guide to the Kingdoms of Thornmere, Vet Engi, and
			the Eastern Marches.
		</header>

		<div class="main-layout">
			<!-- Sidebar -->
			<nav class="sidebar">
				<h3>Navigation</h3>
				<ul>
					<li><a href="/">Main Page</a></li>
					<li><a href="/thornmere.html">Thornmere</a></li>
					<li><a href="/vetengi.html">Vet Engi</a></li>
					<li><a href="east.html">Eastern Marches</a></li>
				</ul>

				<h3>History</h3>
				<ul>
					<li><a href="/history.html">Historical Timeline</a></li>
					<li><a href="/timeline.html">Modern Timeline</a></li>
					<li><a href="/events.html">Key Events</a></li>
				</ul>

				<h3>Meta</h3>
				<ul>
					<li><a href="/cat.html">Categories</a></li>
				</ul>
			</nav>

			<!-- Main content -->
			<div class="wiki-container">
				test
			</div>
		</div>
	</body>
</html>
